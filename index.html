
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Awais AI</title>
<style>
body{margin:0;background:#0b1220;color:white;font-family:Arial}
header{padding:20px;background:#14243b;text-align:center}
h1{color:#55c8ff;margin:5px}
main{max-width:600px;margin:auto;padding:15px}
#chat{height:55vh;overflow:auto;background:#14243b;padding:12px;border-radius:15px}
.msg{padding:12px;margin:9px 0;border-radius:12px;white-space:pre-wrap}
.user{background:#17517a;text-align:right}
.ai{background:#26364d}
textarea{width:100%;box-sizing:border-box;padding:13px;margin-top:10px;border-radius:10px;border:1px solid #456;background:#14243b;color:white}
button{padding:13px;border:0;border-radius:10px;background:#55c8ff;color:#071321;font-weight:bold;margin-top:10px}
.send{width:100%}
small{color:#aabbd0}
</style>
</head>
<body>
<header>
<h1>✦ AWAIS AI</h1>
<small>Your Personal AI Assistant</small>
</header>
<main>
<h3>Assalam-o-Alaikum!</h3>
<div id="chat">
<div class="msg ai">Main Awais AI hoon. Mujh se baat shuru karein!</div>
</div>
<p><small id="status">Backend connection ready</small></p>
<textarea id="question" rows="3" placeholder="Apna sawal likhein..."></textarea>
<button class="send" id="sendBtn" onclick="sendMessage()">Send Message ➤</button>
</main>
<script>
const API_URL = "https://awais-ai-backend.awaisrehman2277.workers.dev/";

async function sendMessage(){
 const input=document.getElementById("question");
 const btn=document.getElementById("sendBtn");
 const chat=document.getElementById("chat");
 const status=document.getElementById("status");
 const q=input.value.trim();

 if(!q)return;

 const user=document.createElement("div");
 user.className="msg user";
 user.textContent=q;
 chat.appendChild(user);

 input.value="";
 btn.disabled=true;
 btn.textContent="Please wait...";
 status.textContent="Awais AI soch raha hai...";

 const reply=document.createElement("div");
 reply.className="msg ai";
 reply.textContent="Jawab aa raha hai...";
 chat.appendChild(reply);
 chat.scrollTop=chat.scrollHeight;

 try{
  const response=await fetch(API_URL,{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({message:q})
  });

  const data=await response.json();

  if(!response.ok){
   throw new Error(data.error || "Server error");
  }

  reply.textContent=data.reply || "Jawab nahi mila.";
  status.textContent="Awais AI connected";
 }catch(error){
  reply.textContent="Error: "+error.message;
  status.textContent="Connection error";
 }finally{
  btn.disabled=false;
  btn.textContent="Send Message ➤";
  chat.scrollTop=chat.scrollHeight;
 }
}
</script>
</body>
</html>
